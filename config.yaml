# AI Ops Agent 配置文件
# 所有配置项均可通过同名环境变量覆盖（环境变量优先级更高）

ai:
  # API 地址（支持 OpenAI 兼容接口）
  api_url: "https://api.openai.com/v1/chat/completions"
  # API 密钥（设环境变量 AI_API_KEY 更安全）
  api_key: ""
  # 模型名称
  model: "gpt-3.5-turbo"
  # API 超时（秒）
  timeout: 30
  # 最大重试次数
  max_retries: 3

# 采集配置
collector:
  # 快照存储目录
  snapshot_dir: "data/snapshots"
  # 快照保留天数
  retention_days: 7
  # 日志扫描路径
  log_paths:
    - "/var/log/syslog"
    - "/var/log/auth.log"

# 进程守护配置
guard:
  # 关键进程列表
  processes:
    - "sshd"
    - "nginx"
    - "mysql"
  # 检查间隔（秒）
  check_interval: 60
  # 失败重试次数
  max_retries: 3

# 报告配置
report:
  # 报告输出目录
  output_dir: "data/reports"
  # 报告格式: markdown / html
  format: "html"
